<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zonal Value Map</title>
  <style>
html,body,#map{margin:0;height:100%;font:13px system-ui,sans-serif}
.panel{position:absolute;left:10px;top:10px;width:250px;background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 6px #0003;max-height:calc(100% - 40px);overflow:auto;box-sizing:border-box}
.panel h1{font-size:15px;margin:0 0 6px}
.panel h4{margin:10px 0 4px;font-size:12px;text-transform:uppercase;color:#555}
#cities{display:flex;flex-wrap:wrap;gap:4px} #cities button{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:3px 9px;cursor:pointer;font:inherit}
#results button{display:block;width:100%;text-align:left;border:0;background:#f3f4f6;margin-top:2px;padding:5px;cursor:pointer;font:inherit}
#q{width:100%;box-sizing:border-box;padding:6px;margin-top:8px;font:inherit}
#vclass{width:100%;margin:2px 0 6px;padding:4px;font:inherit}
#vlegend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:middle;border-radius:2px}
#vlegend i.vconf{height:0;border-top:2px dashed #7e22ce;border-radius:0}
.vnote{font-weight:600;margin-bottom:4px} .vunit{font-size:11px;color:#555}
.muted{color:#666} .warn{color:#b42318}
#vgaps ul{padding-left:14px} #vgaps li{margin:2px 0} #vgaps .why{color:#666} #vgaps details{margin:2px 0}
details{margin-top:8px;font-size:11px;color:#444} ul{padding-left:16px;margin:4px 0}
@media(max-width:600px){.panel{width:calc(100% - 76px);max-height:42vh}}
</style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>Zonal values</h1>
    <div id="cities"></div>
    <input id="q" placeholder="Search a city, barangay or street" autocomplete="off" /><div id="results"></div>
    <h4>Classification</h4><select id="vclass" aria-label="Classification"></select>
    <div id="vlegend"></div>
    <details id="vgaps"><summary>Loading schedules…</summary></details>
    <details><summary>Data sources</summary><ul>
      <li>Zonal values: BIR department orders per RDO, linked above (<a href="https://www.bir.gov.ph/zonal-values" target="_blank" rel="noopener">bir.gov.ph</a>)</li>
      <li>Streets and named places: © OpenStreetMap contributors (ODbL)</li>
      <li>Barangay and city boundaries: OCHA COD-AB (PSA), indicative</li>
    </ul></details>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
